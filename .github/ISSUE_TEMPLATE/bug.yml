name: Bug
description: Quelque chose ne marche pas comme prévu
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: Que s'est-il passé ?
      description: Ce que tu as vu, et ce que tu attendais.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire
      placeholder: |
        1. Aller sur…
        2. Cliquer sur…
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Partie du jeu
      options: [Marché crypto, Bourse, Minage, Banques, Événements, Boutique / succès, Création d'actifs, Compte / connexion, Admin, Autre]
  - type: input
    id: env
    attributes:
      label: Navigateur / appareil
  - type: markdown
    attributes:
      value: "**Faille de sécurité ?** N'ouvre pas d'issue : voir [SECURITY.md](../blob/main/SECURITY.md)."
