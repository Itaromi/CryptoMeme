name: Bug
description: Quelque chose ne marche pas comme prévu
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Merci de prendre le temps de signaler un bug ! Vérifie d'abord qu'il n'existe pas déjà une issue sur le même sujet.

        **Faille de sécurité ?** N'ouvre pas d'issue publique : voir [SECURITY.md](https://github.com/Itaromi/CryptoMeme/blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: Que s'est-il passé ?
      description: Ce que tu as vu, et ce que tu attendais.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire
      placeholder: |
        1. Aller sur…
        2. Cliquer sur…
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Partie du jeu
      options: [Marché crypto, Bourse, Minage, Banques, Événements, Boutique / succès, Création d'actifs, Compte / connexion, Admin, Autre]
  - type: input
    id: env
    attributes:
      label: Navigateur / appareil
  - type: markdown
    attributes:
      value: |
        > [!NOTE]
        > Tu peux t'aider d'une IA pour analyser ou rédiger, mais vérifie que le bug se reproduit vraiment chez toi. Une issue courte et exacte vaut mieux qu'un long texte généré.
