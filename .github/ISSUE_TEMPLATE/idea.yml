name: Idée
description: Une mécanique, une crypto absurde, un événement, un équilibrage…
labels: ['type: idée', 'statut: à trier']
body:
  - type: textarea
    id: idea
    attributes:
      label: L'idée
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Pourquoi c'est fun
  - type: textarea
    id: economy
    attributes:
      label: Impact sur l'économie
      description: Est-ce que ça crée de l'argent ? Peut-on en abuser ?
  - type: markdown
    attributes:
      value: |
        > [!NOTE]
        > Une IA peut t'aider à formuler ton idée : garde-la courte et relis-la pour qu'elle dise vraiment ce que tu veux.
